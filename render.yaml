# Render.com blueprint: one web service serves the API and the built website.
services:
  - type: web
    name: airward
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AIRWARD_ADMIN_TOKEN   # set a secret to enable POST /api/reload (optional)
        sync: false
